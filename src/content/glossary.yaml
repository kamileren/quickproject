# One entry per term, for the whole book. `id` is what chapters write in <Term id="...">.
# Keep definitions to one or two plain sentences.

- id: feature
  term: Feature
  definition: One measured property of an example that the model is allowed to look at, such as hours studied.
- id: label
  term: Label
  definition: The known correct answer for an example, such as the exam score. Also called the target.
- id: model
  term: Model
  definition: A rule with adjustable numbers that turns an input into a prediction. Learning means choosing those numbers.
- id: parameter
  term: Parameter
  definition: One of the adjustable numbers inside a model. A line has two, its slope and its bias.
- id: slope
  term: Slope
  definition: How much the prediction changes when the input grows by one unit. Also called the weight.
- id: bias
  term: Bias
  definition: The prediction when the input is zero, where the line crosses the vertical axis. Also called the intercept.
- id: residual
  term: Residual
  definition: The true value minus the prediction for one example. It is how far, and in which direction, the model missed.
- id: loss
  term: Loss
  definition: A single number that says how wrong a model is on a set of examples. Lower is better, and zero is perfect.
- id: mse
  term: Mean squared error
  definition: The average of the squared residuals. Squaring makes every miss positive and makes big misses count much more.
- id: least-squares
  term: Least squares
  definition: Choosing the model that makes the mean squared error as small as possible.
- id: closed-form
  term: Closed-form solution
  definition: An answer you can compute directly with a formula, with no trial and error.
- id: rmse
  term: Root mean squared error
  definition: The square root of the mean squared error. It is in the same units as the thing being predicted.
- id: r-squared
  term: R squared
  definition: The share of the variation in the target that the model explains. 1 is perfect, 0 is no better than always guessing the average.
- id: extrapolation
  term: Extrapolation
  definition: Predicting for inputs outside the range the model was fitted on. The model has no evidence there, so it can be badly wrong.
- id: outlier
  term: Outlier
  definition: An example that sits far from the pattern the rest of the data follows.
- id: example
  term: Example
  definition: One row of data, such as one student. Also called a sample or a data point.
- id: dataset
  term: Dataset
  definition: A collection of examples, usually arranged as a table with one row per example.
- id: supervised
  term: Supervised learning
  definition: Learning from examples that come with the right answer attached, so the model can be corrected.
- id: unsupervised
  term: Unsupervised learning
  definition: Learning from examples with no answers attached. The goal is to find structure, such as groups.
- id: regression
  term: Regression
  definition: Predicting a number, such as a score or a price.
- id: classification
  term: Classification
  definition: Predicting a category, such as pass or fail.
- id: training
  term: Training
  definition: The process of adjusting the parameters of a model so that its predictions match the examples.
- id: generalize
  term: Generalize
  definition: To predict well on new examples that were not used to fit the model. This is the real goal of learning.
- id: test-set
  term: Test set
  definition: Examples held back and never used for fitting, so they can show how the model does on data it has not seen.
- id: gradient
  term: Gradient
  definition: The list of slopes of the loss, one per parameter. It points in the direction in which the loss grows fastest.
- id: learning-rate
  term: Learning rate
  definition: The number that sets how far each step of gradient descent moves. Too small is slow, too large overshoots.
- id: gradient-descent
  term: Gradient descent
  definition: Repeatedly nudging the parameters a small step against the gradient, so the loss goes down.
- id: converge
  term: Converge
  definition: To settle down. A run has converged when further steps no longer change the parameters or the loss noticeably.
- id: diverge
  term: Diverge
  definition: To blow up. Each step makes the loss larger than the last, usually because the learning rate is too big.
- id: epoch
  term: Epoch
  definition: One full pass through the training data.
- id: mini-batch
  term: Mini-batch
  definition: A small random handful of examples used to estimate the gradient cheaply for one step.
- id: sgd
  term: Stochastic gradient descent
  definition: Gradient descent where each step uses a random mini-batch instead of the whole dataset. Noisier, but far cheaper per step.
- id: convex
  term: Convex
  definition: Shaped like a single bowl. A convex loss has one lowest point and no other dips to get stuck in.
- id: underfitting
  term: Underfitting
  definition: When a model is too simple to follow the real pattern. It does badly on the data it was fitted to and on new data alike.
- id: overfitting
  term: Overfitting
  definition: When a model follows the accidents of its training data instead of the real pattern. It looks excellent on that data and does badly on new data.
- id: noise
  term: Noise
  definition: The part of the data that no model could predict, such as luck on the day. It differs from one sample to the next.
- id: training-set
  term: Training set
  definition: The examples used to fit the parameters of a model.
- id: validation-set
  term: Validation set
  definition: Examples held back from fitting and used to choose between models or settings. Not the same as the test set.
- id: hyperparameter
  term: Hyperparameter
  definition: A setting you choose before training, such as the degree of a curve or the learning rate. The model does not learn it from the data.
- id: leakage
  term: Data leakage
  definition: When information from the validation or test examples slips into training. It makes results look better than they will be in real use.
- id: cross-validation
  term: Cross-validation
  definition: Splitting the data into several parts and taking turns to hold each part out, so every example is used for both fitting and checking.
- id: model-bias
  term: Bias (of a model)
  definition: Error from the model being too rigid to match the real pattern, however much data it sees. Not the same thing as the bias term b of a line.
- id: variance
  term: Variance (of a model)
  definition: How much the fitted model changes when it is trained on a different sample of data. Flexible models have more of it.
- id: regularization
  term: Regularization
  definition: Any change to training that discourages a model from fitting noise, usually a penalty on large weights.
- id: ridge
  term: Ridge regression
  definition: Least squares with a penalty on the sum of squared weights. It shrinks every weight toward zero but rarely to exactly zero.
- id: lasso
  term: Lasso
  definition: Least squares with a penalty on the sum of absolute weights. It pushes some weights to exactly zero, which removes those features.
- id: feature-selection
  term: Feature selection
  definition: Deciding which features a model should use and which it should ignore.
- id: sparse
  term: Sparse
  definition: Having most entries equal to zero. A sparse model uses only a few of its features.
- id: standardize
  term: Standardize
  definition: Rescale a feature so that its average is 0 and its typical spread is 1. It puts features on a common footing.
- id: logistic-regression
  term: Logistic regression
  definition: A model for yes/no questions. It computes a weighted sum of the features and squashes it into a probability between 0 and 1.
- id: sigmoid
  term: Sigmoid
  definition: The S-shaped function that turns any number into a value between 0 and 1. Large positive inputs give nearly 1, large negative ones nearly 0.
- id: probability
  term: Probability
  definition: A number from 0 to 1 saying how likely something is. 0 means never, 1 means certain, 0.5 means a coin flip.
- id: log-loss
  term: Log loss
  definition: The loss used for probabilities. It is the negative logarithm of the probability the model gave to what actually happened. Also called cross-entropy.
- id: threshold
  term: Threshold
  definition: The cut-off probability above which a model answers yes. 0.5 is the usual default, but it is a choice.
- id: decision-boundary
  term: Decision boundary
  definition: The dividing line between the inputs a model labels one class and those it labels the other.
- id: linear-classifier
  term: Linear classifier
  definition: A classifier whose decision boundary is straight, a point with one feature, a line with two, a flat sheet with more.
- id: separable
  term: Separable
  definition: Data in which one straight boundary divides the two classes with no mistakes at all.
- id: imbalanced
  term: Imbalanced data
  definition: Data in which one class is much rarer than the other, such as 1 ill patient for every 9 healthy ones.
- id: confusion-matrix
  term: Confusion matrix
  definition: A two-by-two table that counts predictions by what was predicted and what was true. It shows which kinds of mistake a model makes.
- id: false-positive
  term: False positive
  definition: A no that the model called yes. A false alarm.
- id: false-negative
  term: False negative
  definition: A yes that the model called no. A miss.
- id: precision
  term: Precision
  definition: Of everything the model flagged as yes, the share that really was yes. High precision means few false alarms.
- id: recall
  term: Recall
  definition: Of everything that really was yes, the share the model flagged. High recall means few misses. Also called sensitivity.
- id: f1
  term: F1 score
  definition: A single number combining precision and recall. It is high only when both are high.
- id: roc-curve
  term: ROC curve
  definition: A plot of the share of real yeses caught against the share of real noes wrongly flagged, for every possible threshold.
- id: auc
  term: AUC
  definition: Area under the ROC curve. It is the chance that the model scores a random yes above a random no. 1 is perfect, 0.5 is guessing.
- id: knn
  term: k-nearest neighbours
  definition: A method that classifies a new point by finding the k most similar known points and taking a vote among them.
- id: euclidean-distance
  term: Euclidean distance
  definition: Ordinary straight-line distance. Square the difference in each feature, add them up, and take the square root.
- id: instance-based
  term: Instance-based learning
  definition: Learning by storing the examples themselves and comparing new cases against them, rather than fitting weights.
- id: curse-of-dimensionality
  term: Curse of dimensionality
  definition: The way data becomes sparse as features are added. With many features every point is far from every other, and "nearest" stops meaning much.
- id: bayes-rule
  term: Bayes' rule
  definition: The rule for updating a belief when evidence arrives. It combines how likely something was beforehand with how well the evidence fits it.
- id: prior
  term: Prior
  definition: How likely something is before looking at the evidence. For spam, the share of all messages that are spam.
- id: posterior
  term: Posterior
  definition: How likely something is after taking the evidence into account. It is what Bayes' rule computes.
- id: likelihood
  term: Likelihood
  definition: How probable the evidence is if a given answer were true, such as how often the word "free" turns up in spam.
- id: naive-bayes
  term: Naive Bayes
  definition: A classifier that applies Bayes' rule while pretending every feature is independent of the others. Simple, fast, and often good enough.
- id: independence
  term: Independence
  definition: Two things are independent when knowing one tells you nothing about the other. Words in a message are not, which is why the assumption is called naive.
- id: smoothing
  term: Smoothing
  definition: Adding a small amount to every count so that nothing is ever judged impossible just because it was not in the training data.
- id: margin
  term: Margin
  definition: The empty gap between a decision boundary and the closest training points on either side. A wider margin leaves more room for error.
- id: svm
  term: Support vector machine
  definition: A classifier that chooses the boundary with the widest possible margin between the classes.
- id: support-vector
  term: Support vector
  definition: A training point that sits on the edge of the margin, or inside it. These points alone determine where the boundary goes.
- id: soft-margin
  term: Soft margin
  definition: A margin that some points are allowed to cross, at a cost. It lets an SVM handle classes that overlap.
- id: kernel
  term: Kernel
  definition: A function that measures how similar two examples are. Using one lets a method that draws straight boundaries draw curved ones.
- id: rbf
  term: RBF kernel
  definition: The most common kernel. It scores two points as similar when they are close together, with a setting for how quickly that similarity fades with distance.
