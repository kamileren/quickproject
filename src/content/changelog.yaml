# What changed in the book, newest first. Shown at /changelog/.
# Add an entry whenever something a reader would notice is published.
- id: 2026-11-21-map
  date: "2026-11-21"
  title: A map you can read, and more to try on the cover
  items:
    - The map now lists the chapters by name. Pick one to see what to read first, what comes next, and how many minutes stand between you and it.
    - The cover shows one of four small figures, a different one each visit.
    - Reading times adjust to your own pace once you have finished two chapters.
    - The end of each chapter sums up your checkpoints and exercises there.
    - Key terms on the recap page link to the glossary, and a mistyped address suggests the chapter you meant.
- id: 2026-11-21-cover
  date: "2026-11-21"
  title: A cover you can play with
  items:
    - The front page has a live figure to try, and shows returning readers where they stopped.
    - Every chapter has a fifth exercise that sends you back to one of its figures.
    - On a phone, definitions open as a sheet at the bottom, and a plot stays in view while you use its controls.
    - Table headings no longer capitalise symbols, and small grey text is easier to read.
- id: 2026-11-21-polish
  date: "2026-11-21"
  title: A better phone view
  items:
    - A bar at the top of every page with search, text settings and a menu. On a phone it slides away while you read.
    - The home page shows your progress in one place once you have finished a chapter.
    - The glossary can be filtered as you type.
- id: 2026-11-21-reading
  date: "2026-11-21"
  title: Reading comfort and study tools
  items:
    - Search opens over any page with the / key, and there are keyboard shortcuts for moving around (press ? to see them).
    - Reading settings for text size and dark colours.
    - Exercises can be ticked off and have hints; missed checkpoint questions are collected on a review page.
    - A recap page with every chapter's key points, and a map of how the chapters depend on each other.
    - Pages you have opened stay readable without a connection, and chapters print cleanly.
- id: 2026-11-21-exercises
  date: "2026-11-21"
  title: Exercises in every chapter
  items:
    - Every chapter now ends with four exercises and worked solutions, a list of what you can now do, and a common mistake to avoid.
    - Glossary, notation and search pages. Terms link back to the chapter that introduces them.
    - Reading progress is remembered in your browser.
    - Pages with region maps load up to eight times faster.
- id: 2026-11-21-networks
  date: "2026-11-21"
  title: "Part IV: Neural Networks"
  items:
    - Eight chapters that build a neural network from a single neuron up to a classifier for pictures of clothing.
    - A short Python file for each chapter, which can be opened in Colab.
- id: 2026-11-21-classification
  date: "2026-11-21"
  title: "Part II: Classification, and the Toolkit"
  items:
    - Five chapters on classification, from logistic regression to support vector machines.
    - Three toolkit chapters covering the vectors, derivatives and probability the book uses.
- id: 2026-11-18-rebuild
  date: "2026-11-18"
  title: The book is rebuilt
  items:
    - A new site with interactive figures in every section.
    - "Part I: Learning from Data, in five chapters."
